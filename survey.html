<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>葛洲坝高速服务站满意度调查</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f5f6f8;margin:0;padding:18px}.card{max-width:650px;margin:auto;background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 12px #ddd}h1{text-align:center;font-size:24px}.q{margin:24px 0}.opt{display:block;padding:11px;border:1px solid #ddd;border-radius:8px;margin:8px 0}textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px}button{width:100%;padding:13px;background:#1677ff;color:#fff;border:0;border-radius:9px;font-size:17px}</style></head><body><div class="card"><h1>葛洲坝高速服务站满意度调查</h1><p>感谢您参与，请根据实际体验填写。</p><form method="post">{% for i in range(5) %}<div class="q"><b>{{i+1}}. {{questions[i]}}</b>{% for o in options %}<label class="opt"><input type="radio" name="q{{i+1}}" value="{{o}}" required> {{o}}</label>{% endfor %}</div>{% endfor %}<div class="q"><b>意见建议（选填）</b><textarea name="suggestion" rows="5" placeholder="欢迎留下意见和建议"></textarea></div><button>提交问卷</button></form></div></body></html>
